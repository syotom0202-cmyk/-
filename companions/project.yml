name: KaitoCompanions
options:
  minimumXcodeGenVersion: 2.42.0
settings:
  base:
    IPHONEOS_DEPLOYMENT_TARGET: 16.0
    SWIFT_VERSION: 5.0
    TARGETED_DEVICE_FAMILY: "2"
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.0

targets:
  AIScreenBridge:
    type: application
    platform: iOS
    sources:
      - path: ScreenBridge/App
      - path: ScreenBridge/Shared
    info:
      path: ScreenBridge/App/Info.plist
      properties:
        CFBundleDisplayName: AI Screen Bridge
        UILaunchScreen: {}
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
          - UIInterfaceOrientationPortraitUpsideDown
        CFBundleURLTypes:
          - CFBundleURLName: com.kaito.screenbridge
            CFBundleURLSchemes:
              - kaitoscreenbridge
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kaito.screenbridge
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
    entitlements:
      path: ScreenBridge/App/AIScreenBridge.entitlements
    dependencies:
      - target: ScreenBridgeBroadcast
        embed: true

  ScreenBridgeBroadcast:
    type: app-extension
    platform: iOS
    sources:
      - path: ScreenBridge/Broadcast
      - path: ScreenBridge/Shared
    info:
      path: ScreenBridge/Broadcast/Info.plist
      properties:
        CFBundleDisplayName: Screen Bridge Broadcast
        NSExtension:
          NSExtensionPointIdentifier: com.apple.broadcast-services-upload
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).SampleHandler
          NSExtensionAttributes:
            RPBroadcastProcessMode: RPBroadcastProcessModeSampleBuffer
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kaito.screenbridge.broadcast
        APPLICATION_EXTENSION_API_ONLY: YES
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
    entitlements:
      path: ScreenBridge/Broadcast/ScreenBridgeBroadcast.entitlements

  LayoutManager:
    type: application
    platform: iOS
    sources:
      - path: LayoutManager/App
    info:
      path: LayoutManager/App/Info.plist
      properties:
        CFBundleDisplayName: Kaito Layout
        UILaunchScreen: {}
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
          - UIInterfaceOrientationPortraitUpsideDown
        LSApplicationQueriesSchemes:
          - com.miniclip.agar.io
          - kaitoscreenbridge
          - chatgpt
        CFBundleURLTypes:
          - CFBundleURLName: com.kaito.layout
            CFBundleURLSchemes:
              - kaitolayout
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kaito.layoutmanager
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO

  KaitoObserver:
    type: application
    platform: iOS
    sources:
      - path: Observer/App
      - path: Observer/Shared
    info:
      path: Observer/App/Info.plist
      properties:
        CFBundleDisplayName: Kaito Observer
        UILaunchScreen: {}
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
          - UIInterfaceOrientationPortraitUpsideDown
        CFBundleURLTypes:
          - CFBundleURLName: com.kaito.observer
            CFBundleURLSchemes:
              - kaitoobserver
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kaito.observer
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
    entitlements:
      path: Observer/App/KaitoObserver.entitlements
    dependencies:
      - target: KaitoObserverBroadcast
        embed: true

  KaitoObserverBroadcast:
    type: app-extension
    platform: iOS
    sources:
      - path: Observer/Broadcast
      - path: Observer/Shared
    info:
      path: Observer/Broadcast/Info.plist
      properties:
        CFBundleDisplayName: Kaito Observer Broadcast
        NSExtension:
          NSExtensionPointIdentifier: com.apple.broadcast-services-upload
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).SampleHandler
          NSExtensionAttributes:
            RPBroadcastProcessMode: RPBroadcastProcessModeSampleBuffer
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kaito.observer.broadcast
        APPLICATION_EXTENSION_API_ONLY: YES
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
    entitlements:
      path: Observer/Broadcast/KaitoObserverBroadcast.entitlements
